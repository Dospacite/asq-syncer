<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Anime list control{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {% if session.get('admin') %}
      <header class="app-header">
        <a class="brand" href="{{ url_for('dashboard') }}">Anime list control</a>
        <nav aria-label="Main navigation">
          <a href="{{ url_for('dashboard') }}">Overview</a>
          <a href="{{ url_for('anime_browser') }}">Browse anime</a>
          <form method="post" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="button button-ghost" type="submit">Sign out</button>
          </form>
        </nav>
      </header>
    {% endif %}
    <main id="main-content" class="page-shell {% block shell_class %}{% endblock %}">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}" role="status">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
